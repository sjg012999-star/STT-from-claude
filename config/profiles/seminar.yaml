# 학회 세미나 프로필 (Phase 1 기본 프로필)
# PLAN.md §5 / §3-④ 참고. 프로필은 "STT 모델"이 아니라 "설정"의 차이만 담는다.
name: seminar
description: 학회 세미나 — 전문용어 밀도 높음, Q&A 포함, 경량 화자 구분

# --- STT 단계 설정 ---
stt:
  language: auto          # ko/en 자동 감지 + 코드스위칭 대응
  diarization: light      # 발표자/질문자 경량 구분 (Phase 2에서 실제 구현)
  # 25MB 초과 시 무음 경계 분할 업로드 (openai_provider TODO)
  max_upload_mb: 25

# --- 전처리 (ffmpeg) ---
preprocess:
  sample_rate: 16000
  channels: 1
  loudnorm: "I=-16:TP=-1.5:LRA=11"   # EBU R128
  trim_silence: true

# --- 교정 계층 (Claude) ---
correction:
  chunk_chars: 4000       # 청크 크기 (약 4천 토큰 근사)
  overlap_chars: 500      # 청크 간 오버랩 (문맥 단절 방지)
  # 교정은 반드시 difflib diff 검증 — 기록 없는 수정은 롤백 (CLAUDE.md 불변원칙 2)

# --- 요약 템플릿 ---
summary:
  template: seminar
  sections:
    - 발표 개요
    - 배경
    - 방법론
    - 주요 결과
    - 한계·향후 과제
    - Q&A 정리

# --- 용어집 (config/glossaries/ 아래 파일명, 있으면 로드) ---
glossaries:
  - seminar_sample
